---
- name: Install and Setup Jenkins with Docker and plugins
  hosts: localhost
  become: yes

  vars:
    jenkins_home: /var/lib/jenkins
    plugin_manager_url: https://github.com/jenkinsci/plugin-installation-manager-tool/releases/download/2.13.0/jenkins-plugin-manager-2.13.0.jar
    plugin_manager_path: /tmp/plugin-manager.jar
    jenkins_deb_url: https://pkg.jenkins.io/debian-stable/binary/jenkins_2.555.1_all.deb
    jenkins_home: /var/lib/jenkins

    plugins_list:
      - git
      - workflow-aggregator
      - docker-workflow
      - blueocean

  tasks:

  # ================= BASE =================

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install base packages
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - git
          - openjdk-21-jdk
          - wget
        state: present

  # ================= DOCKER SETUP =================

    - name: Create keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /tmp/docker.asc
        mode: '0644'

    - name: Convert Docker GPG key to binary
      command: >
        gpg --dearmor -o /etc/apt/keyrings/docker.gpg /tmp/docker.asc
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Set permission on Docker GPG key
      file:
        path: /etc/apt/keyrings/docker.gpg
        mode: '0644'

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_lsb.codename }} stable"
        state: present
        filename: docker

    - name: Update apt after Docker repo
      apt:
        update_cache: yes

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Enable and start Docker
      systemd:
        name: docker
        enabled: yes
        state: started

    - name: Add users to docker group
      user:
        name: "{{ item }}"
        groups: docker
        append: yes
      loop:
        - ubuntu
        - jenkins
      ignore_errors: yes

  # ================= JENKINS INSTALL =================

    - name: Download Jenkins
      get_url:
        url: "{{ jenkins_deb_url }}"
        dest: /tmp/jenkins.deb

    - name: Install Jenkins
      apt:
        deb: /tmp/jenkins.deb

    - name: Enable Jenkins
      service:
        name: jenkins
        enabled: yes

    - name: Start Jenkins
      service:
        name: jenkins
        state: started

  # ================= JENKINS CONFIG =================

    - name: Stop Jenkins
      service:
        name: jenkins
        state: stopped
      ignore_errors: yes

    - name: Disable setup wizard
      lineinfile:
        path: /etc/default/jenkins
        regexp: '^JENKINS_JAVA_OPTIONS='
        line: 'JENKINS_JAVA_OPTIONS="-Djenkins.install.runSetupWizard=false"'
        create: yes

    - name: Clean old Jenkins setup
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ jenkins_home }}/secrets/initialAdminPassword"
        - "{{ jenkins_home }}/users"
        - "{{ jenkins_home }}/plugins"

    - name: Recreate required directories
      file:
        path: "{{ item }}"
        state: directory
        owner: jenkins
        group: jenkins
      loop:
        - "{{ jenkins_home }}/users"
        - "{{ jenkins_home }}/plugins"
        - "{{ jenkins_home }}/init.groovy.d"

    - name: Create admin user
      copy:
        dest: "{{ jenkins_home }}/init.groovy.d/create-user.groovy"
        content: |
          import jenkins.model.*
          import hudson.security.*

          def instance = Jenkins.instanceOrNull
          if (instance != null) {
            def realm = new HudsonPrivateSecurityRealm(false)
            realm.createAccount("admin","admin123")
            instance.setSecurityRealm(realm)

            def strategy = new FullControlOnceLoggedInAuthorizationStrategy()
            strategy.setAllowAnonymousRead(false)
            instance.setAuthorizationStrategy(strategy)

            instance.save()
          }
        owner: jenkins
        group: jenkins

    - name: Mark setup complete
      copy:
        dest: "{{ item }}"
        content: "2.0"
        owner: jenkins
        group: jenkins
      loop:
        - "{{ jenkins_home }}/jenkins.install.UpgradeWizard.state"
        - "{{ jenkins_home }}/jenkins.install.InstallUtil.lastExecVersion"

    - name: Download plugin manager
      get_url:
        url: "{{ plugin_manager_url }}"
        dest: "{{ plugin_manager_path }}"
        mode: '0755'

    - name: Start Jenkins
      service:
        name: jenkins
        state: started

    - name: Wait for Jenkins
      uri:
        url: http://localhost:8080/login
        status_code: 200
      register: result
      retries: 20
      delay: 5
      until: result.status == 200

    - name: Create plugin list
      copy:
        dest: /tmp/plugins.txt
        content: |
          {% for plugin in plugins_list %}
          {{ plugin }}
          {% endfor %}

    - name: Install Jenkins plugins
      shell: |
        java -jar {{ plugin_manager_path }} \
        --war /usr/share/java/jenkins.war \
        --plugin-file /tmp/plugins.txt \
        --plugin-download-directory {{ jenkins_home }}/plugins

    - name: Fix permissions
      file:
        path: "{{ jenkins_home }}"
        recurse: yes
        owner: jenkins
        group: jenkins

    - name: Restart Jenkins
      service:
        name: jenkins
        state: restarted

    - name: Wait after restart
      pause:
        seconds: 30

    - name: Final message
      debug:
        msg: |
          ✅ Jenkins + Docker setup complete!
          URL: http://REPLACE-IP:8080
          Username: admin
          Password: admin123

    - name: Create init.groovy.d directory
      file:
        path: "{{ jenkins_home }}/init.groovy.d"
        state: directory
        owner: jenkins
        group: jenkins
        mode: '0755'

    - name: Copy pipeline.groovy to Jenkins init directory
      copy:
        src: /home/ubuntu/pipeline.groovy
        dest: "{{ jenkins_home }}/init.groovy.d/pipeline.groovy"
        owner: jenkins
        group: jenkins
        mode: '0644'

    - name: Restart Docker service
      service:
        name: docker
        state: restarted

    - name: Restart Jenkins service
      service:
        name: jenkins
        state: restarted


