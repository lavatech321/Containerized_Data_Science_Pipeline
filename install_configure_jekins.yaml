---
- name: Install and Setup Jenkins with plugins
  hosts: localhost
  become: yes

  vars:
    jenkins_home: /var/lib/jenkins
    plugin_manager_url: https://github.com/jenkinsci/plugin-installation-manager-tool/releases/download/2.13.0/jenkins-plugin-manager-2.13.0.jar
    plugin_manager_path: /tmp/plugin-manager.jar
    jenkins_deb_url: https://pkg.jenkins.io/debian-stable/binary/jenkins_2.555.1_all.deb

    plugins_list:
      - git
      - workflow-aggregator
      - docker-workflow
      - blueocean

  tasks:

  # ================= INSTALLATION =================

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install required packages
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - git
          - openjdk-21-jdk
          - wget
        state: present

    - name: Download Jenkins .deb package
      get_url:
        url: "{{ jenkins_deb_url }}"
        dest: /tmp/jenkins.deb

    - name: Install Jenkins
      apt:
        deb: /tmp/jenkins.deb

    - name: Enable Jenkins service
      service:
        name: jenkins
        enabled: yes

    - name: Start Jenkins
      service:
        name: jenkins
        state: started

  # ================= CONFIGURATION =================

    - name: Stop Jenkins
      service:
        name: jenkins
        state: stopped
      ignore_errors: yes

    - name: Disable setup wizard
      lineinfile:
        path: /etc/default/jenkins
        regexp: '^JENKINS_JAVA_OPTIONS='
        line: 'JENKINS_JAVA_OPTIONS="-Djenkins.install.runSetupWizard=false"'
        create: yes

    - name: Remove initial admin password
      file:
        path: "{{ jenkins_home }}/secrets/initialAdminPassword"
        state: absent

    - name: Remove old users
      file:
        path: "{{ jenkins_home }}/users"
        state: absent

    - name: Recreate users directory
      file:
        path: "{{ jenkins_home }}/users"
        state: directory
        owner: jenkins
        group: jenkins

    - name: Remove old plugins
      file:
        path: "{{ jenkins_home }}/plugins"
        state: absent

    - name: Recreate plugins directory
      file:
        path: "{{ jenkins_home }}/plugins"
        state: directory
        owner: jenkins
        group: jenkins

    - name: Create init.groovy.d directory
      file:
        path: "{{ jenkins_home }}/init.groovy.d"
        state: directory
        owner: jenkins
        group: jenkins

    - name: Create admin user via Groovy script
      copy:
        dest: "{{ jenkins_home }}/init.groovy.d/create-user.groovy"
        content: |
          import jenkins.model.*
          import hudson.security.*

          def instance = Jenkins.instanceOrNull

          if (instance != null) {
            def realm = new HudsonPrivateSecurityRealm(false)
            realm.createAccount("admin","admin123")
            instance.setSecurityRealm(realm)

            def strategy = new FullControlOnceLoggedInAuthorizationStrategy()
            strategy.setAllowAnonymousRead(false)
            instance.setAuthorizationStrategy(strategy)

            instance.save()
          }
        owner: jenkins
        group: jenkins
        mode: '0644'

    - name: Mark setup complete
      copy:
        dest: "{{ jenkins_home }}/jenkins.install.UpgradeWizard.state"
        content: "2.0"
        owner: jenkins
        group: jenkins

    - name: Mark last exec version
      copy:
        dest: "{{ jenkins_home }}/jenkins.install.InstallUtil.lastExecVersion"
        content: "2.0"
        owner: jenkins
        group: jenkins

    - name: Download plugin manager
      get_url:
        url: "{{ plugin_manager_url }}"
        dest: "{{ plugin_manager_path }}"
        mode: '0755'

    - name: Reload systemd
      command: systemctl daemon-reexec

    - name: Start Jenkins
      service:
        name: jenkins
        state: started

    - name: Wait for Jenkins to be up
      uri:
        url: http://localhost:8080/login
        status_code: 200
      register: result
      retries: 20
      delay: 5
      until: result.status == 200

    - name: Create plugin list file
      copy:
        dest: /tmp/plugins.txt
        content: |
          {% for plugin in plugins_list %}
          {{ plugin }}
          {% endfor %}

    - name: Install Jenkins plugins
      shell: |
        java -jar {{ plugin_manager_path }} \
        --war /usr/share/java/jenkins.war \
        --plugin-file /tmp/plugins.txt \
        --plugin-download-directory {{ jenkins_home }}/plugins \
        --verbose
      register: plugin_install
      retries: 3
      delay: 10
      until: plugin_install.rc == 0

    - name: Fix Jenkins permissions
      file:
        path: "{{ jenkins_home }}"
        recurse: yes
        owner: jenkins
        group: jenkins

    - name: Restart Jenkins
      service:
        name: jenkins
        state: restarted

    - name: Wait after restart
      pause:
        seconds: 30

    - name: Verify plugins installed
      shell: "ls {{ jenkins_home }}/plugins | grep workflow"
      register: verify_plugins
      failed_when: verify_plugins.rc != 0

    - name: Show success message
      debug:
        msg: |
          Jenkins setup successful!
          URL: http://REPLACE-IP:8080
          Username: admin
          Password: admin123

